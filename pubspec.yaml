name: gaitlab
description: Cross-platform experimental running gait telemetry for a waist-mounted phone.
publish_to: none
version: 0.4.0+4

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: 7.1.1
  path_provider: 2.1.6
  share_plus: 13.3.1
  wakelock_plus: 1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
