name: Validate Android and iOS
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry and QA dependencies
        run: |
          pipx install poetry
          poetry install --no-interaction
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Create platform runners and resolve packages
        run: poetry run bash scripts/bootstrap.sh
      - name: Ensure native bootstrap preserves tracked application code
        run: git diff --exit-code -- lib test pubspec.yaml README.md
      - run: flutter analyze
      - run: flutter test
      - run: poetry run python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build Android debug APK
        run: flutter build apk --debug
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry and QA dependencies
        run: |
          pipx install poetry
          poetry install --no-interaction
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Create platform runners and resolve packages
        run: poetry run bash scripts/bootstrap.sh
      - name: Ensure native bootstrap preserves tracked application code
        run: git diff --exit-code -- lib test pubspec.yaml README.md
      - run: flutter analyze
      - run: flutter test
      - name: Build iOS simulator (no signing)
        run: flutter build ios --simulator --no-codesign
  public-dataset-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry and QA dependencies
        run: |
          pipx install poetry
          poetry install --no-interaction
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Fetch and integrity-check small public trials (activity labels only)
        run: poetry run python tools/public_datasets.py --fetch --out reports/public/source_manifest.json
      - name: Replay raw smartphone running trial through production Dart engine
        run: dart run tools/replay_public.dart --file data/public/azi350/running_pants.csv --activity running --out reports/public/running_pants.json
      - name: Replay sitting negative control through production Dart engine
        run: dart run tools/replay_public.dart --file data/public/azi350/sitting_pants.csv --activity sitting --out reports/public/sitting_pants.json
      - name: Replay second running phone placement through production Dart engine
        run: dart run tools/replay_public.dart --file data/public/azi350/running_upper.csv --activity running --out reports/public/running_upper.json
      - name: Upload replay reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-dataset-replay
          path: reports/public/
          if-no-files-found: warn
